<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Livvic:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/contact.css">
    <script src="../js/main.js" defer></script>
</head>

<body>
    <header>
         <nav class="nav-bar-header">
        <a href="/" class="logo"><img src="assets/icons/logo.svg" alt="myteam" /></a>

        <ul class="navigation-list">
          <li>
            <a href="index.html">home</a>
          </li>
          <li>
            <a href="pages/about.html">about</a>
          </li>
        </ul>

        <button type="button" class="button-top">contact us</button>
      </nav>
    </header>
    <main>

        <img id="icon-left" src="../assets/icons/bg-pattern-about-2-contact-1.svg" alt="../assets/icons/bg-pattern-about-2-contact-1.svg">
        <img id="icon-right" src="../assets/icons/bg-pattern-contact-2.svg" alt="../assets/icons/bg-pattern-contact-2.svg">

        <div class="contact-section">

            <!-- Left side -->
            <div class="left-side">
                <h1>Contact</h1>

                <h2>Ask us about</h2>

                <div class="about-us">

                    <div>
                            <img src="../assets/icons/icon-person.svg" alt="../assets/icons/icon-person.svg">
                        <p>
                            The quality of our talent network
                        </p>
                    </div>

                    <div>
                            <img src="../assets/icons/icon-cog.svg" alt="../assets/icons/icon-cog.svg">
                        <p>
                            Usage & implementation of our software
                        </p>
                    </div>

                    <div>
                            <img src="../assets/icons/icon-chart.svg" alt="../assets/icons/icon-chart.svg">
                        <p>
                            How we help drive innovation
                        </p>
                    </div>
                </div>
            </div>

            <!-- Right side -->
            <div class="right-side">

                        <input type="text" id="name" name="name" placeholder="Name">

                        <input type="text" id="email" name="email" placeholder="Email Adress">

                        <input type="text" id="company" name="company" placeholder="Company Name">

                        <input type="text" id="title" name="title" placeholder="Title">

                        <textarea type="text" id="message" name="message" placeholder="Message"></textarea>

                <button type="submit">submit</button>
            </div>

        </div>

    </main>
    <footer>
        <div>
            <nav class="nav-bar-footer">
            <a href="/" class="logo"><img src="assets/icons/logo.svg" alt="myteam" /></a>

            <ul class="navigation-list">
                <li>
                <a href="index.html">home</a>
                </li>
                <li>
                <a href="pages/about.html">about</a>
                </li>
            </ul>
            </nav>
        </div>

        <address>
            <p>987 Hillcrest Lane<br> Irvine, CA<br> California 92714<br> Call Us: 949-833-7432</p>
        </address>

        <div>
            <ul class="social-list">
            <li>
                <a href=""><img src="assets/icons/icon-facebook.svg" alt="facebook" /></a>
            </li>
            <li>
                <a href=""><img src="assets/icons/icon-pinterest.svg" alt="pinterest" /></a>
            </li>
            <li>
                <a href=""><img src="assets/icons/icon-twitter.svg" alt="twitter" /></a>
            </li>
            </ul>

            <p>Copyright 2020. All Rights Reserved</p>
      </div>
    </footer>
</body>

</html>
